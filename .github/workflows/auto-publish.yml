name: Automatic Astro publication
on:
  workflow_run:
    workflows: ['Fast acceptance']
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: astro-auto-publication-${{ github.repository }}
  cancel-in-progress: true
jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Dispatch the existing trusted publisher for the exact current accepted main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/auto-publication.mjs dispatch
