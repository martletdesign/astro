name: Versioned Astro archive rehearsal
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        prefix: ['', '/preview']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - run: npm ci --ignore-scripts --legacy-peer-deps && npm test
      - name: Use the Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build and verify a pinned local archive
        env:
          DOCS_DEPLOY_PREFIX: ${{ matrix.prefix }}
          DESIGN_BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/archives"
          printf '{"schemaVersion":1,"family":"martlet","framework":"astro","latestStable":null,"versions":[]}\n' > "$RUNNER_TEMP/baseline.json"
          export DOCS_ARCHIVE_ROOT="$RUNNER_TEMP/archives" DOCS_BASELINE_PATH="$RUNNER_TEMP/baseline.json"
          export DOCS_BASELINE_SHA256="$(sha256sum "$DOCS_BASELINE_PATH" | cut -d' ' -f1)"
          export DOCS_VERSION="$(node -p "require('./package.json').version")"
          export RELEASE_TAG="v$DOCS_VERSION"
          node scripts/docs-versions/build-release.mjs
          before=$(sha256sum "$DOCS_ARCHIVE_ROOT/$DOCS_VERSION/manifest.json")
          if node scripts/docs-versions/build-release.mjs; then echo 'Existing snapshot was overwritten' >&2; exit 1; fi
          test "$before" = "$(sha256sum "$DOCS_ARCHIVE_ROOT/$DOCS_VERSION/manifest.json")"
          timeout 90s node scripts/docs-versions/browser-check.mjs "$DOCS_ARCHIVE_ROOT" "$DOCS_DEPLOY_PREFIX" martlet
          DOCS_FAMILY=martlet node scripts/docs-versions/rehearse-r2.mjs
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: python3 scripts/docs-versions/rehearse-history.py
