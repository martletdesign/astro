name: Reviewed Astro staged publication
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact verified main commit
        required: true
      artifact_sha256:
        description: Independently reviewed publishable archive SHA-256
        required: true
      distribution_tag:
        description: npm distribution tag
        type: choice
        options: [next, latest]
        default: next
      publish_mode:
        description: Stage for owner approval or publish accepted bytes directly
        type: choice
        options: [stage, publish]
        default: stage
permissions:
  contents: read
concurrency:
  group: astro-staged-publication-${{ github.repository }}
  cancel-in-progress: false
jobs:
  stage:
    # The same exact-head publisher handles manual staging and automatic publication.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: astro-production-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Verify event source and reviewed production revision
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$APPROVED_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$APPROVED_SHA"
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund && npm test && git diff --exit-code
      - name: Verify the exact Core dependency is published
        run: node scripts/check-core-publication.mjs
      - name: Export the exact public archive and verify its identity and registry absence
        env:
          EXPECTED_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir "$RUNNER_TEMP/astro-src" "$RUNNER_TEMP/astro-out"
          git archive HEAD | tar --same-permissions -x -C "$RUNNER_TEMP/astro-src"
          node -e 'const fs=require("fs"),p=process.argv[1],v=JSON.parse(fs.readFileSync(p));if(v.name!=="@martlet/astro"||!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(v.version)||v.private!==true)process.exit(1);v.private=false;fs.writeFileSync(p,JSON.stringify(v,null,2)+"\n")' "$RUNNER_TEMP/astro-src/package.json"
          RELEASE_TAG="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')" node --input-type=module -e 'import {identityFromFiles} from "./scripts/tag-release-guard.mjs";await identityFromFiles({tag:process.env.RELEASE_TAG,repository:process.env.GITHUB_REPOSITORY,expectedRepository:"martletdesign/astro",expectedName:"@martlet/astro"})'
          (cd "$RUNNER_TEMP/astro-src" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/astro-out")
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          node scripts/tag-release-cli.mjs inspect "$RUNNER_TEMP/astro-out/martlet-astro-$VERSION.tgz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/astro-out/martlet-astro-$VERSION.tgz" | sha256sum --check
          node --input-type=module -e 'import {registryState} from "./scripts/tag-release-guard.mjs";const state=await registryState(url=>fetch(url,{signal:AbortSignal.timeout(30000),redirect:"error"}),"https://registry.npmjs.org/","@martlet/astro",JSON.parse(await (await import("node:fs/promises")).readFile("package.json","utf8")).version);if(state!=="absent")throw Error("Version exists or registry identity/absence is unverified; inspect and recover rather than republish")'
      - name: Publish or stage the exact verified bytes
        env:
          NPM_TAG: ${{ inputs.distribution_tag }}
          PUBLISH_MODE: ${{ inputs.publish_mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$NPM_TAG" = next || "$NPM_TAG" = latest ]]
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          RELEASE_TAG="v$VERSION" node scripts/tag-release-cli.mjs confirm-absent
          node scripts/auto-publication.mjs check-tag
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          case "$PUBLISH_MODE" in
            publish) npm publish "$RUNNER_TEMP/astro-out/martlet-astro-$VERSION.tgz" --access public --tag "$NPM_TAG" --provenance ;;
            stage) npm stage publish "$RUNNER_TEMP/astro-out/martlet-astro-$VERSION.tgz" --access public --tag "$NPM_TAG" --provenance ;;
            *) echo 'Unknown publication mode' >&2; exit 1 ;;
          esac

  complete:
    if: ${{ needs.stage.result == 'success' && inputs.publish_mode == 'publish' }}
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm install --global npm@11.15.0 --ignore-scripts
      - name: Create the expected immutable tag and dispatch verified release completion
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: node scripts/auto-publication.mjs complete
